<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table, tr, td, th{
            border : 1px solid black;
            border-collapse: collapse;
            padding : 5px 10px;
            text-align: center;
        }
        th{
            background-color: beige;
        }
        tr:nth-child(even){
            background-color: azure;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- html 코드는 id가 app인 태그 안에서 작업 -->
        <div>
            <label>아이디 : <input v-model="info.userid"></label>
        </div>
        <div>
            <label>비밀번호 : <input v-model="info.pwd"></label>
        </div>
        <div>
            <button @click="fnLogin">로그인</button>
        </div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                info : {
                    userid : "",
                    pwd : ""
                }
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnLogin: function () {
                let self = this;
                fetch("http://localhost:3000/login?userId=" + self.info.userid + "&pwd=" + self.info.pwd, {
                    method : "GET",
                    headers : {
                        "Content-Type" : "application/json"
                    }
                })
                    .then(res => res.json())
                    .then(data => {
                        if(data.result == "success"){
                            location.href = "../student/stu-list.html";
                        } else {
                            alert("로그인 실패!");
                        }
                    })
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            let self = this;
        }
    });

    app.mount('#app');
</script>
