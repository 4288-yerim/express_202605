<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table, tr, td, th{
            border : 1px solid black;
            border-collapse: collapse;
            padding : 5px 10px;
            text-align: center;
        }
        th{
            background-color: beige;
        }
        tr:nth-child(even){
            background-color: azure;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- html 코드는 id가 app인 태그 안에서 작업 -->
        <select v-model="info.kind">
            <option :value="1">공지사항</option>
            <option :value="2">자유게시판</option>
            <option :value="3">질문게시판</option>
        </select>
        <div>
           <label>작성자 : <input v-model="info.userId" ></label>
        </div>
        <div>
           <label>제목 : <input v-model="info.title" ></label>
        </div>
        <div>
           <label>작성글 : <input v-model="info.contents" ></label>
        </div>
        <div>
          <button @click="fnAdd">등록</button>
        </div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                info : {
                    userId : "",
                    title : "",
                    contents : "",
                    kind : "2"
                },
                
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnAdd: function () {
                let self = this;
                fetch("http://localhost:3000/board", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(self.info)
                })
                    .then(res => res.json())
                    .then(data => {
                        alert("등록됨!");
                        location.href = "board-list.html";
                    })
                    .catch(err => {
                        console.error(err);
                    });
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        let self = this;
        const queryParams = new URLSearchParams(window.location.search);
        self.boardNo = queryParams.get('boardNo') || '';
        self.fnGetInfo();
        }
    });

    app.mount('#app');
</script>
