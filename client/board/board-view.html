<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table, tr, td, th{
            border : 1px solid black;
            border-collapse: collapse;
            padding : 5px 10px;
            text-align: center;
        }
        th{
            background-color: beige;
        }
        tr:nth-child(even){
            background-color: azure;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- html 코드는 id가 app인 태그 안에서 작업 -->
        <div>
            <table>
                <tr>
                    <td>번호</td>
                    <td>제목</td>
                    <td>작성자</td>
                    <td>작성글</td>
                    <td>조회수</td>
                    <td>작성일</td>
                </tr>
                <tr>
                    <td>{{info.boardNo}}</td>
                    <td>{{info.title}}</td>
                    <td>{{info.userId}}</td>
                    <td>{{info.contents}}</td>
                    <td>{{info.cnt}}</td>
                    <td>{{info.cdateTime}}</td>
                </tr>
            </table>
        </div>
            <button @click="fnDelete">삭제</button>
            <button @click="fnEdit" style="margin-left: 10px;">수정</button>
            <button @click="fnList" style="margin-left: 10px;">목록</button>
        </div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                boardNo : "",
                info : {}
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnGetInfo: function () {
                let self = this;
                fetch("http://localhost:3000/board/"+self.boardNo)
                    .then(res => res.json())
                    .then(data => {
                        self.info = data.info;
                    })
                    .catch(err => {
                        console.error(err);
                    });
            },
            fnDelete: function () {
                let self = this;
                fetch("http://localhost:3000/board/"+self.boardNo, {
                    method: "DELETE"
                })
                    .then(res => res.json())
                    .then(data => {
                        if(confirm("삭제하시겠습니까?")) {
                            alert("삭제되었습니다.");
                            location.href = "board-list.html";
                        }
                    })
                    .catch(err => {
                        console.error(err);
                    });
            },
            fnEdit: function () {
                let self = this;
                location.href = "board-edit.html?boardNo="+self.boardNo;
            },
            fnList: function () {
                let self = this;
                location.href = "board-list.html";
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        let self = this;
        const queryParams = new URLSearchParams(window.location.search);
        self.boardNo = queryParams.get('boardNo') || '';
        self.fnGetInfo();
        }
    });

    app.mount('#app');
</script>
